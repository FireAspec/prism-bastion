<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact replay QA</title><style>body{margin:24px;background:#121d26;color:#e4edf3;font:15px system-ui}main{max-width:1280px;margin:auto}canvas{width:100%;max-height:60vh;object-fit:contain;background:#192d38;border:1px solid #55707a}button,select,input{margin:5px;padding:5px}pre{white-space:pre-wrap;background:#20343e;padding:12px}label{display:inline-block}h1{font-size:24px}</style><main><h1>Contact replay QA</h1><p>Recorded world coordinates, HP, shield, paid layers and event IDs. This is a diagnostic view, not the game renderer.</p><label>Trace JSON <input id="file" type="file" accept=".json"></label><select id="scenario" aria-label="Scenario"></select><button id="play">Play</button><button id="back">Previous</button><button id="next">Next</button><label>Playback <select id="rate"><option value="2">2 frames/s</option><option value="6">6 frames/s</option><option value="60">60 frames/s</option></select></label><input id="seek" aria-label="Frame" type="range" min="0" max="0" value="0"><p id="status" role="status">Load traces.json</p><canvas id="field" width="1280" height="720"></canvas><pre id="details"></pre></main><script>
const $=id=>document.getElementById(id), canvas=$('field'), ctx=canvas.getContext('2d');let traces=[],index=0,timer=null;
function current(){return traces[Number($('scenario').value)||0]}
function circle(x,y,r,color,fill=false){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx[fill?'fillStyle':'strokeStyle']=color;ctx[fill?'fill':'stroke']()}
function line(a,b,color){ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function textAt(s,p,color){ctx.fillStyle=color;ctx.fillText(s,p.x+12,p.y-12)}
function draw(){const t=current();if(!t)return;const f=t.frames[index],s=f.state;$('seek').value=index;$('status').textContent=`${t.origin.toUpperCase()} • ${t.name} • tick ${f.tick} • frame ${index+1}/${t.frames.length} • credits ${s.credits} • ${t.findings.length} findings`;ctx.clearRect(0,0,1280,720);ctx.font='16px monospace';ctx.lineWidth=2;
for(const a of s.towers){circle(a.pos.x,a.pos.y,12,'#7fd8ff',true);textAt(a.id,a.pos,'#7fd8ff')}
for(const e of s.enemies){const r=t.radii[e.defId]||8;circle(e.pos.x,e.pos.y,r,'#f8ad74',true);if(e.shield>0)circle(e.pos.x,e.pos.y,r+3,'#7edcf2');textAt(`${e.id} HP ${e.hp.toFixed(1)} S ${e.shield.toFixed(1)} L ${e.paidLayers.join(',')||'-'}`,e.pos,'#ffffff')}
for(const p of s.projectiles){line(p.previous,p.pos,'#ffe38b');circle(p.pos.x,p.pos.y,Math.max(1,p.attack.projectileRadius),'#ffe38b',true)}
for(const a of s.strikes){const ang=Math.atan2(a.direction.y,a.direction.x),half=a.attack.arc*Math.PI/360;ctx.strokeStyle=a.remainingWindup>0?'#a0a6af':'#ffdf87';ctx.beginPath();ctx.moveTo(a.pos.x,a.pos.y);ctx.arc(a.pos.x,a.pos.y,a.attack.range,ang-half,ang+half);ctx.closePath();ctx.stroke()}
for(const e of f.events){if(!e.pos)continue;if(e.to)line(e.pos,e.to,'#9de7ff');if(['hit','projectileImpact','strikeContact'].includes(e.kind)){circle(e.pos.x,e.pos.y,10,'#fb77c6');line({x:e.pos.x-7,y:e.pos.y},{x:e.pos.x+7,y:e.pos.y},'#fb77c6');line({x:e.pos.x,y:e.pos.y-7},{x:e.pos.x,y:e.pos.y+7},'#fb77c6');textAt(`${e.kind} #${e.id}`,{x:e.pos.x,y:e.pos.y+44},'#fb77c6')}}
$('details').textContent=JSON.stringify({tick:f.tick,time:s.time,events:f.events,enemy:s.enemies.map(e=>({id:e.id,hp:e.hp,shield:e.shield,paidLayers:e.paidLayers})),findings:t.findings},null,2)}
function stop(){clearInterval(timer);timer=null;$('play').textContent='Play'}function step(n){const t=current();if(!t)return;index=Math.max(0,Math.min(t.frames.length-1,index+n));draw();if(n>0&&index===t.frames.length-1)stop()}
function choose(){stop();index=0;$('seek').max=Math.max(0,current().frames.length-1);draw()}
$('file').onchange=async()=>{try{stop();const data=JSON.parse(await $('file').files[0].text());if(!Array.isArray(data)||!data.length||data.some(t=>t.version!==1||!t.frames?.length))throw Error('Expected nonempty v1 trace array');traces=data;$('scenario').replaceChildren(...traces.map((t,i)=>new Option(t.name,i)));choose()}catch(e){$('status').textContent=String(e)}};
$('scenario').onchange=choose;$('seek').oninput=()=>{stop();index=Number($('seek').value);draw()};$('back').onclick=()=>{stop();step(-1)};$('next').onclick=()=>{stop();step(1)};$('play').onclick=()=>{if(timer){stop();return}if(!current())return;if(index===current().frames.length-1)index=0;$('play').textContent='Pause';timer=setInterval(()=>step(1),1000/Number($('rate').value))};$('rate').onchange=()=>{if(timer){stop();$('play').click()}};
</script></html>
