  <linearGradient id="light" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ebca7b" stop-opacity=".16"/><stop offset=".55" stop-color="#c9b885" stop-opacity=".03"/><stop offset="1" stop-color="#082d47" stop-opacity=".4"/></linearGradient>
