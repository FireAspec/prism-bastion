<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Mirror terraces garden with reflecting pools and workshop ruins">
<defs>
 <linearGradient id="base" x2="0" y2="1"><stop stop-color="#1b3a43"/><stop offset="1" stop-color="#0b2631"/></linearGradient>
 <linearGradient id="top" x2="0" y2="1"><stop stop-color="#41655e"/><stop offset="1" stop-color="#2a514e"/></linearGradient>
 <linearGradient id="mid" x2="0" y2="1"><stop stop-color="#315a55"/><stop offset="1" stop-color="#234b4b"/></linearGradient>
 <linearGradient id="low" x2="0" y2="1"><stop stop-color="#224c4b"/><stop offset="1" stop-color="#15383e"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#164553"/><stop offset=".5" stop-color="#26738a"/><stop offset="1" stop-color="#143b50"/></linearGradient>
 <radialGradient id="warm"><stop stop-color="#fce5b0" stop-opacity=".45"/><stop offset="1" stop-color="#fce5b0" stop-opacity="0"/></radialGradient>
 <pattern id="mosaic" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M0 0H54M0 0V54" fill="none" stroke="#d8ca9f" stroke-width="1" opacity=".13"/><circle cx="27" cy="27" r="1.3" fill="#b7e0b9" opacity=".23"/></pattern>
 <g id="shrub"><circle r="13" fill="#132f35"/><circle cx="-4" cy="-3" r="10" fill="#467d69"/><circle cx="5" cy="-4" r="8" fill="#75a07a"/><circle cx="4" cy="6" r="9" fill="#285f58"/><circle cx="-2" cy="-3" r="2.5" fill="#e4c77c"/></g>
 <g id="lamp"><circle r="27" fill="url(#warm)"/><path d="M0-10L9 0 0 10-9 0Z" fill="#e6bd75" stroke="#fff1be" stroke-width="2"/><circle r="2.5" fill="#fff9df"/></g>
</defs>
<rect width="1280" height="720" fill="url(#base)"/>
