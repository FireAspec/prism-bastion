    <radialGradient id="aura"><stop stop-color="#8ef9d1" stop-opacity=".32"/><stop offset=".45" stop-color="#38c7d1" stop-opacity=".09"/><stop offset="1" stop-color="#2affed" stop-opacity="0"/></radialGradient>
