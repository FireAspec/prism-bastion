<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Штормовой эстуарий, руины маячной сети и прибрежные острова">
  <defs>
    <radialGradient id="earth" cx="53%" cy="46%" r="82%">
      <stop stop-color="#2d5854"/><stop offset=".5" stop-color="#173d43"/><stop offset="1" stop-color="#0b202e"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#071f35"/><stop offset=".46" stop-color="#10506b"/><stop offset="1" stop-color="#08273b"/>
