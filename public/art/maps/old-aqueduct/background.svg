 <!-- Route precisely mirrors MapDef. Road is clearly visible under both arches. -->
 <use xlink:href="#lane" fill="none" stroke="#264b4c" stroke-width="86" opacity=".2" transform="translate(0 7)" filter="url(#shadow)" stroke-linejoin="round"/>
 <use xlink:href="#lane" fill="none" stroke="#62736b" stroke-width="74" stroke-linejoin="round"/>
 <use xlink:href="#lane" fill="none" stroke="#f0e2bb" stroke-width="66" stroke-linejoin="round"/>
 <use xlink:href="#lane" fill="none" stroke="#e0cfa2" stroke-width="62" stroke-linejoin="round"/>
 <use xlink:href="#lane" fill="none" stroke="#fff3cd" stroke-width="3" stroke-dasharray="4 17" opacity=".66" stroke-linejoin="round"/>

 <!-- Pads are visual suggestions, not extra placement restrictions. -->
 <g><use xlink:href="#pad" x="210" y="147"/><use xlink:href="#pad" x="272" y="407"/><use xlink:href="#pad" x="490" y="188"/><use xlink:href="#pad" x="535" y="455"/><use xlink:href="#pad" x="666" y="156"/><use xlink:href="#pad" x="683" y="365"/><use xlink:href="#pad" x="772" y="394"/><use xlink:href="#pad" x="830" y="209"/><use xlink:href="#pad" x="829" y="449"/><use xlink:href="#pad" x="1028" y="305"/><use xlink:href="#pad" x="1086" y="515"/></g>

 <!-- Two pairs of stone supports matching all four MapDef blocker footprints. -->
 <path d="M353 231L395 230L415 280L363 291Z M357 406L412 412L427 468L360 478Z M886 294L926 292L952 354L902 359Z M892 487L954 482L973 554L908 558Z" transform="translate(5 8)" fill="#234345" opacity=".36" filter="url(#shadow)"/>
