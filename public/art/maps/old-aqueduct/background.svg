<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Старый акведук: зелёная долина, две древние арки, дорога, водохранилище и навигационная станция">
 <defs>
  <linearGradient id="meadow" x2="1" y2="1"><stop stop-color="#5e886a"/><stop offset=".48" stop-color="#88a97b"/><stop offset="1" stop-color="#476d61"/></linearGradient>
  <radialGradient id="light" cx="38%" cy="15%" r="90%"><stop stop-color="#fff2b3" stop-opacity=".25"/><stop offset="1" stop-color="#193e48" stop-opacity=".27"/></radialGradient>
  <linearGradient id="pool" x2="1" y2="1"><stop stop-color="#51bac0"/><stop offset=".5" stop-color="#318f9c"/><stop offset="1" stop-color="#19566e"/></linearGradient>
  <linearGradient id="stone" x2=".8" y2="1"><stop stop-color="#f0e3ba"/><stop offset=".5" stop-color="#c9bea0"/><stop offset="1" stop-color="#899286"/></linearGradient>
  <pattern id="grass" width="80" height="71" patternUnits="userSpaceOnUse"><path d="M12 20l4 -8m40 41 4 -7m15 -25 5 2" stroke="#294f46" stroke-width="2" opacity=".2" stroke-linecap="round"/><circle cx="36" cy="17" r="1.6" fill="#f5e9b1" opacity=".33"/></pattern>
  <pattern id="blocks" width="27" height="23" patternUnits="userSpaceOnUse"><path d="M0 0H27M0 11H27M14 0V11M4 11V23" stroke="#65766d" stroke-width="1.4" fill="none" opacity=".55"/></pattern>
  <pattern id="ripples" width="76" height="43" patternUnits="userSpaceOnUse"><path d="M5 12q14 -9 29 0m6 25q13 -7 29 0" fill="none" stroke="#e5f4e6" stroke-width="2.2" opacity=".27" stroke-linecap="round"/></pattern>
  <filter id="shadow"><feGaussianBlur stdDeviation="6"/></filter>
  <path id="lane" d="M0 220 L80 220 L150 234 L215 267 L276 310 L340 338 L402 346 L465 339 L520 317 L570 285 L622 260 L680 259 L740 279 L796 314 L846 357 L892 398 L941 422 L995 424 L1050 413 L1103 387 L1149 355 L1202 338 L1280 338"/>
  <g id="tree"><ellipse cy="12" rx="23" ry="11" fill="#204d45" opacity=".33"/><circle cx="-9" cy="-6" r="20" fill="#376b50"/><circle cx="10" cy="-10" r="23" fill="#477b59"/><circle cx="-1" cy="-18" r="18" fill="#77a172"/><path d="M-12 -18q7 -11 20 -9" stroke="#c0cda0" stroke-width="4" opacity=".55" stroke-linecap="round" fill="none"/></g>
  <g id="shrub"><ellipse cy="7" rx="18" ry="10" fill="#2f5448" opacity=".3"/><circle cx="-8" r="10" fill="#426e4e"/><circle cx="7" cy="-3" r="12" fill="#6e936a"/></g>
  <g id="pad"><circle cy="5" r="37" fill="#273f40" opacity=".19"/><circle r="34" fill="#b7b595" opacity=".75" stroke="#566f64" stroke-width="3"/><circle r="28" fill="#9caf8c" stroke="#e9e2b9" stroke-width="2" stroke-dasharray="5 8"/><path d="M-12 0H12M0 -12V12" stroke="#e9e2b9" stroke-width="2" opacity=".65"/></g>
  <g id="flower"><path d="M-5 0H5M0 -5V5" stroke="#f4edc9" stroke-width="3" stroke-linecap="round"/><circle r="2.3" fill="#d6a654"/></g>
 </defs>
 <rect width="1280" height="720" fill="url(#meadow)"/>
 <path d="M-20 56C235 130 310 -23 532 32S979 116 1300 17V-10H0Z" fill="#3f6b59" opacity=".5"/>
