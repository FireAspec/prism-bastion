 <path d="M920 98L980 72L1071 65L1151 78L1217 115L1234 172L1210 218L1151 251L1073 244L1003 222L951 183L915 136Z" transform="translate(0 8)" fill="#163b50" opacity=".28" filter="url(#shadow)"/>
