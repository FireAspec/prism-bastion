<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Часовая площадь: медные часовые механизмы, освещённая мостовая, литейные цеха и два бассейна охлаждения">
