  <pattern id="tiles" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(12)"><path d="M0 0H48V48H0Z" fill="none" stroke="#c0d3bd" stroke-opacity=".065" stroke-width="2"/></pattern>
