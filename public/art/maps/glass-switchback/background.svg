<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Glass switchback: glowing tidal basins, slate ledges, glass crystals and a copper survey station">
 <defs>
  <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#285c5c"/><stop offset=".42" stop-color="#214a4d"/><stop offset="1" stop-color="#102e3b"/></linearGradient>
  <linearGradient id="pool" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#086173"/><stop offset=".54" stop-color="#167e84"/><stop offset="1" stop-color="#0c425c"/></linearGradient>
  <linearGradient id="cliff" x1="0" y1="0" x2=".3" y2="1"><stop stop-color="#9caaa0"/><stop offset=".32" stop-color="#617f7b"/><stop offset="1" stop-color="#264450"/></linearGradient>
  <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4fff1"/><stop offset=".48" stop-color="#6bdacb"/><stop offset="1" stop-color="#226c91"/></linearGradient>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8daa1"/><stop offset=".55" stop-color="#ac8054"/><stop offset="1" stop-color="#633e35"/></linearGradient>
  <radialGradient id="atmosphere"><stop stop-color="#93efc5" stop-opacity=".2"/><stop offset="1" stop-color="#60dccb" stop-opacity="0"/></radialGradient>
  <filter id="halo" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#071b27" flood-opacity=".55"/></filter>
  <pattern id="terrain" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(29)"><path d="M0 0V24" stroke="#b0d2c5" stroke-opacity=".065" stroke-width="2"/></pattern>
  <pattern id="specks" width="43" height="43" patternUnits="userSpaceOnUse"><circle cx="3" cy="6" r="1.4" fill="#c1d9c7" opacity=".2"/><circle cx="27" cy="30" r="1" fill="#f4dba9" opacity=".28"/></pattern>
  <g id="shard" stroke="#e1fff1" stroke-width="1.5" stroke-linejoin="round"><path d="M0 -28L12 -6 4 20 -10 12Z" fill="url(#crystal)"/><path d="M0 -28L4 20 12 -6" stroke="#e0fff4" fill="none" opacity=".45"/></g>
  <g id="reeds" stroke-linecap="round" fill="none" stroke="#aeb88a" stroke-width="2.5"><path d="M0 0Q-6 -12 -4 -24M0 0Q5 -10 10 -27M0 0V-31"/><path d="M-4 -24l-3 -5M10 -27l4 -7M0 -31l-2 -8" stroke="#e2c88c"/></g>
