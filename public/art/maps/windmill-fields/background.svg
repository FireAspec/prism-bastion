<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Поля ветряков — пейзаж</title>
  <desc id="desc">Изумрудные поля с трёхъярусными садами, прудами, медными ветряками и золотым энергетическим узлом. Дорога наносится игровым движком поверх фона.</desc>
  <defs>
    <linearGradient id="ground" x2=".9" y2="1">
      <stop stop-color="#172f38"/><stop offset=".42" stop-color="#244d4b"/><stop offset="1" stop-color="#102d34"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#f9d978" stop-opacity=".64"/><stop offset=".4" stop-color="#e6c85e" stop-opacity=".17"/><stop offset="1" stop-color="#e6c85e" stop-opacity="0"/></radialGradient>
    <linearGradient id="field" x2="0" y2="1"><stop stop-color="#588460"/><stop offset=".48" stop-color="#3b7159"/><stop offset="1" stop-color="#285b51"/></linearGradient>
    <linearGradient id="fieldGold" x2="1" y2="1"><stop stop-color="#b48f4b" stop-opacity=".40"/><stop offset="1" stop-color="#567953" stop-opacity=".03"/></linearGradient>
    <linearGradient id="water" x2=".85" y2="1"><stop stop-color="#236b78"/><stop offset=".5" stop-color="#164d62"/><stop offset="1" stop-color="#163e52"/></linearGradient>
    <linearGradient id="copper" x2="0" y2="1"><stop stop-color="#fff0b5"/><stop offset=".32" stop-color="#bf8650"/><stop offset="1" stop-color="#67483d"/></linearGradient>
    <pattern id="grain" width="52" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)">
      <path d="M0 7H52 M0 19H52 M0 31H52" stroke="#b2c586" stroke-width="1" opacity=".10"/>
      <path d="M16 1l4 5-4 5M43 15l4 5-4 5" fill="none" stroke="#d7d08f" stroke-width="1.25" opacity=".12"/>
    </pattern>
    <pattern id="furrow" width="27" height="31" patternUnits="userSpaceOnUse" patternTransform="rotate(-22)">
      <path d="M4 0v31 M17 0v31" stroke="#e4b36e" stroke-width="3" opacity=".19"/><path d="M8 0v31" stroke="#1c594c" stroke-width="2" opacity=".25"/>
    </pattern>
    <filter id="softglow"><feGaussianBlur stdDeviation="9"/></filter>
    <g id="plant" stroke-linecap="round">
      <path d="M0 6V-4 M0 0l-4-4 M0-1l5-5" stroke="#9ba86b" stroke-width="1.5"/>
      <path d="M-4-5q-5-1-5-5q5-1 5 5M5-6q5-4 8-2q-1 4-8 2" fill="#9bae70"/>
    </g>
    <g id="windmill">
      <ellipse cy="25" rx="25" ry="9" fill="#0d2730" opacity=".56"/>
      <path d="M-14 24L-10-16L-4-34H4L10-16L14 24Z" fill="url(#copper)" stroke="#302f35" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-9-14H9 M-11 4H11 M-13 18H13" stroke="#ffe2a0" stroke-width="2" opacity=".4"/>
      <path d="M-5 23V8Q0-2 5 8V23" fill="#153d42" stroke="#b8ac78" stroke-width="2"/>
      <path d="M-19-17l19-21 19 21" fill="#304c49" stroke="#e2b16e" stroke-width="3" stroke-linejoin="round"/>
      <g transform="translate(0 -18) rotate(16)" stroke-linejoin="round">
        <g stroke="#785743" stroke-width="1.5"><path d="M0 0l-6-38 8-9 7 44Z" fill="#e6c48b"/><path d="M0 0l-6-38 8-9 7 44Z" fill="#e6c48b" transform="rotate(90)"/><path d="M0 0l-6-38 8-9 7 44Z" fill="#e6c48b" transform="rotate(180)"/><path d="M0 0l-6-38 8-9 7 44Z" fill="#e6c48b" transform="rotate(270)"/></g>
        <circle r="6.5" fill="#f7d77d" stroke="#614f3b" stroke-width="3"/>
        <circle r="2" fill="#fff3c9"/>
      </g>
    </g>
  </defs>

  <rect width="1280" height="720" fill="url(#ground)"/>
  <path d="M0 0H1280V720H0Z" fill="url(#grain)"/>
  <!-- Field terraces intentionally have no precise road edges: the renderer owns the road. -->
  <path d="M210 129Q570 101 1029 123L1021 207Q622 223 219 209Z" fill="url(#field)" stroke="#7ca184" stroke-width="3" opacity=".96"/>
  <path d="M225 138Q600 122 1009 137L999 198Q591 203 231 196Z" fill="url(#furrow)"/>
  <path d="M214 137H1014L983 192L239 207Z" fill="url(#fieldGold)"/>
  <path d="M318 388Q510 367 699 387L745 481Q554 502 323 491Z" fill="url(#field)" stroke="#84a785" stroke-width="3"/>
  <path d="M333 398L680 393 720 471Q544 488 335 477Z" fill="url(#furrow)"/>
  <path d="M336 560Q642 548 1002 561L993 640Q674 656 329 643Z" fill="url(#field)" stroke="#769682" stroke-width="3"/>
  <path d="M348 570L984 574 977 631 350 633Z" fill="url(#furrow)"/>
  <path d="M121 290Q182 274 215 294L219 597Q185 618 111 606Z" fill="#41745a" stroke="#7a9b75" stroke-width="2"/>
  <path d="M125 303H207V590H125Z" fill="url(#furrow)" opacity=".75"/>
  <path d="M105 700Q635 662 1190 699" fill="none" stroke="#91ac83" stroke-width="5" opacity=".20"/>
  <path d="M155 18Q635 41 1130 19" fill="none" stroke="#95b09c" stroke-width="5" opacity=".14"/>

  <!-- Pools reproduce exactly the MapDef.water boundaries. -->
  <path d="M428 281L460 269 543 273 574 292 563 325 530 333 452 329 421 307Z" fill="url(#water)" stroke="#8dbdb0" stroke-width="3"/>
  <path d="M878 302L902 283 980 280 1015 298 1023 332 993 347 917 347 884 330Z" fill="url(#water)" stroke="#8dbdb0" stroke-width="3"/>
  <path d="M447 295Q491 281 547 300M892 315Q945 290 1002 312" fill="none" stroke="#afebe2" stroke-width="3" stroke-linecap="round" opacity=".45"/>
  <path d="M457 313q35 8 67 0M917 327q37 9 71-3" fill="none" stroke="#72a8ba" stroke-width="2" opacity=".6"/>
  <g fill="#d7cf8c" opacity=".7"><ellipse cx="441" cy="301" rx="3" ry="7" transform="rotate(20 441 301)"/><ellipse cx="559" cy="304" rx="3" ry="7" transform="rotate(-25 559 304)"/><ellipse cx="895" cy="321" rx="3" ry="7"/><ellipse cx="1005" cy="310" rx="3" ry="7"/></g>

  <!-- Small crops are low-contrast so the road, units and placement previews stay readable. -->
  <g opacity=".55"><use xlink:href="#plant" transform="translate(280 178)"/><use xlink:href="#plant" transform="translate(314 182) scale(.85)"/><use xlink:href="#plant" transform="translate(872 154)"/><use xlink:href="#plant" transform="translate(946 186) scale(.8)"/><use xlink:href="#plant" transform="translate(380 442)"/><use xlink:href="#plant" transform="translate(402 475)"/><use xlink:href="#plant" transform="translate(560 426)"/><use xlink:href="#plant" transform="translate(772 602)"/><use xlink:href="#plant" transform="translate(853 632)"/><use xlink:href="#plant" transform="translate(158 472)"/><use xlink:href="#plant" transform="translate(187 520)"/></g>

  <!-- Fenced foundations match the three blocked polygons in map data. -->
  <g fill="#1a3d41" stroke="#b79360" stroke-width="2.5" stroke-linejoin="round">
    <path d="M125 135L150 125 180 138 190 165 179 191 153 201 126 186 117 160Z"/>
    <path d="M1082 158L1107 149 1131 165 1140 188 1129 213 1105 220 1080 202 1073 180Z"/>
    <path d="M1106 551L1125 542 1147 556 1156 577 1143 599 1122 605 1101 589 1097 567Z"/>
  </g>
  <g opacity=".9"><use xlink:href="#windmill" transform="translate(155 166) scale(.72)"/><use xlink:href="#windmill" transform="translate(1107 185) scale(.72)"/><use xlink:href="#windmill" transform="translate(1126 573) scale(.68)"/></g>
  <!-- Underlay only: the road and exit marker can be painted by the renderer above it. -->
  <circle cx="670" cy="452" r="83" fill="url(#glow)"/>
  <g transform="translate(670 452)" opacity=".82">
    <circle r="26" fill="none" stroke="#b59756" stroke-width="4" stroke-dasharray="8 5"/>
    <circle r="15" fill="#275b59" stroke="#f0ca70" stroke-width="3"/>
    <path d="M-9 0L0-14 9 0 0 14Z" fill="#fde6a2" stroke="#b47c43" stroke-width="2"/>
  </g>
  <g opacity=".55" fill="none" stroke="#e6cb88" stroke-width="2"><path d="M604 452H567"/><path d="M568 452l7-6m-7 6 7 6"/></g>
  <rect x="8" y="8" width="1264" height="704" rx="22" fill="none" stroke="#a3cba7" stroke-width="2" opacity=".18"/>
</svg>
