<!doctype html><html lang="ru"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Портальная арка — галерея</title><style>
:root{color-scheme:dark;font-family:system-ui,'Segoe UI',sans-serif;background:#101b2a;color:#e5f4f2}*{box-sizing:border-box}
body{max-width:1320px;margin:0 auto;padding:30px 22px 70px;background:radial-gradient(ellipse at 80% 0%,#173a47 0%,transparent 50%)}
h1{font-size:clamp(2rem,4vw,3.4rem);margin:0;letter-spacing:-.05em}p{max-width:680px;color:#9fc5c8;line-height:1.6}
h2{margin:35px 0 18px;font-weight:650;color:#c2f0e2} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px}
figure{margin:0;background:linear-gradient(155deg,#213648,#132333);border:1px solid #395566;border-radius:17px;overflow:hidden;box-shadow:0 12px 24px #0002}
.art{position:relative;width:100%;aspect-ratio:1;background:radial-gradient(circle at center,#2f5364 0%,#193042 43%,#101e2c 75%);display:grid;place-items:center;overflow:hidden}
.art:before{content:'';position:absolute;width:80%;height:80%;border:1px dashed #ffffff25;border-radius:50%}
.art img{position:absolute;width:90%;height:90%;object-fit:contain;image-rendering:auto;transition:transform .4s ease}.art:hover img{transform:scale(1.08)}.art img.overlay{z-index:2}
figcaption{padding:13px;min-height:62px;font-size:13px;font-weight:600}small{display:block;font-size:10px;color:#6deed9;letter-spacing:.18em;margin-bottom:5px}
.hero{border-left:3px solid #5de8cb;padding-left:18px}
@media(prefers-reduced-motion:reduce){.art img{transition:none}.art:hover img{transform:none}}
</style></head><body><header class="hero"><h1>Портальная арка</h1><p>16 полноразмерных моделей, 6 совместимых накладок и все варианты 5–2–0. Показаны реальные SVG-ресурсы 128×128 с прозрачным фоном.</p></header>
<h2>Основание и развитие трёх веток</h2><section class="grid"><figure><div class="art"><img loading="lazy" src="base.svg" alt="Основание"/></div><figcaption><small>BASE</small>Основание</figcaption></figure><figure><div class="art"><img loading="lazy" src="a1.svg" alt="Направляющие прилива"/></div><figcaption><small>A1</small>Направляющие прилива</figcaption></figure><figure><div class="art"><img loading="lazy" src="a2.svg" alt="Знак повторения"/></div><figcaption><small>A2</small>Знак повторения</figcaption></figure><figure><div class="art"><img loading="lazy" src="a3.svg" alt="Обратный порог"/></div><figcaption><small>A3</small>Обратный порог</figcaption></figure><figure><div class="art"><img loading="lazy" src="a4.svg" alt="Спираль памяти"/></div><figcaption><small>A4</small>Спираль памяти</figcaption></figure><figure><div class="art"><img loading="lazy" src="a5.svg" alt="Двойная арка бесконечности"/></div><figcaption><small>A5</small>Двойная арка бесконечности</figcaption></figure><figure><div class="art"><img loading="lazy" src="b1.svg" alt="Резонанс трещины"/></div><figcaption><small>B1</small>Резонанс трещины</figcaption></figure><figure><div class="art"><img loading="lazy" src="b2.svg" alt="Осколочный концентратор"/></div><figcaption><small>B2</small>Осколочный концентратор</figcaption></figure><figure><div class="art"><img loading="lazy" src="b3.svg" alt="Рваная кромка"/></div><figcaption><small>B3</small>Рваная кромка</figcaption></figure><figure><div class="art"><img loading="lazy" src="b4.svg" alt="Каскад обломков"/></div><figcaption><small>B4</small>Каскад обломков</figcaption></figure><figure><div class="art"><img loading="lazy" src="b5.svg" alt="Сердце открытого разлома"/></div><figcaption><small>B5</small>Сердце открытого разлома</figcaption></figure><figure><div class="art"><img loading="lazy" src="c1.svg" alt="Линза навигации"/></div><figcaption><small>C1</small>Линза навигации</figcaption></figure><figure><div class="art"><img loading="lazy" src="c2.svg" alt="Экспресс-канал"/></div><figcaption><small>C2</small>Экспресс-канал</figcaption></figure><figure><div class="art"><img loading="lazy" src="c3.svg" alt="Курьерская орбита"/></div><figcaption><small>C3</small>Курьерская орбита</figcaption></figure><figure><div class="art"><img loading="lazy" src="c4.svg" alt="Узловая пересылка"/></div><figcaption><small>C4</small>Узловая пересылка</figcaption></figure><figure><div class="art"><img loading="lazy" src="c5.svg" alt="Три кольца горизонта"/></div><figcaption><small>C5</small>Три кольца горизонта</figcaption></figure></section>
<h2>Все шесть финальных кросс-путей</h2><section class="grid"><figure><div class="art"><img loading="lazy" src="a5.svg" alt="a5"/><img class="overlay" loading="lazy" src="b2-overlay.svg" alt="Накладка b2"/></div><figcaption><small>A5 + B2</small>Финальный кросс-путь</figcaption></figure><figure><div class="art"><img loading="lazy" src="a5.svg" alt="a5"/><img class="overlay" loading="lazy" src="c2-overlay.svg" alt="Накладка c2"/></div><figcaption><small>A5 + C2</small>Финальный кросс-путь</figcaption></figure><figure><div class="art"><img loading="lazy" src="b5.svg" alt="b5"/><img class="overlay" loading="lazy" src="a2-overlay.svg" alt="Накладка a2"/></div><figcaption><small>B5 + A2</small>Финальный кросс-путь</figcaption></figure><figure><div class="art"><img loading="lazy" src="b5.svg" alt="b5"/><img class="overlay" loading="lazy" src="c2-overlay.svg" alt="Накладка c2"/></div><figcaption><small>B5 + C2</small>Финальный кросс-путь</figcaption></figure><figure><div class="art"><img loading="lazy" src="c5.svg" alt="c5"/><img class="overlay" loading="lazy" src="a2-overlay.svg" alt="Накладка a2"/></div><figcaption><small>C5 + A2</small>Финальный кросс-путь</figcaption></figure><figure><div class="art"><img loading="lazy" src="c5.svg" alt="c5"/><img class="overlay" loading="lazy" src="b2-overlay.svg" alt="Накладка b2"/></div><figcaption><small>C5 + B2</small>Финальный кросс-путь</figcaption></figure></section>
<h2>Шесть накладок вторичных веток</h2><section class="grid"><figure><div class="art"><img loading="lazy" src="a1-overlay.svg" alt="A1 — отдельная накладка"/></div><figcaption><small>A1-OVERLAY</small>A1 — отдельная накладка</figcaption></figure><figure><div class="art"><img loading="lazy" src="a2-overlay.svg" alt="A2 — отдельная накладка"/></div><figcaption><small>A2-OVERLAY</small>A2 — отдельная накладка</figcaption></figure><figure><div class="art"><img loading="lazy" src="b1-overlay.svg" alt="B1 — отдельная накладка"/></div><figcaption><small>B1-OVERLAY</small>B1 — отдельная накладка</figcaption></figure><figure><div class="art"><img loading="lazy" src="b2-overlay.svg" alt="B2 — отдельная накладка"/></div><figcaption><small>B2-OVERLAY</small>B2 — отдельная накладка</figcaption></figure><figure><div class="art"><img loading="lazy" src="c1-overlay.svg" alt="C1 — отдельная накладка"/></div><figcaption><small>C1-OVERLAY</small>C1 — отдельная накладка</figcaption></figure><figure><div class="art"><img loading="lazy" src="c2-overlay.svg" alt="C2 — отдельная накладка"/></div><figcaption><small>C2-OVERLAY</small>C2 — отдельная накладка</figcaption></figure></section></body></html>
