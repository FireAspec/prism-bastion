<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Резонатор — модели</title><style>body{background:#0c202c;color:#e9f3f1;font:16px system-ui,sans-serif;margin:24px}h1,h2{color:#f5d29a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.tile{margin:0;background:#173341;border:1px solid #49616b;border-radius:12px;padding:12px;text-align:center}.model{position:relative;aspect-ratio:1;max-width:200px;margin:auto}.model img{width:100%;height:100%;object-fit:contain}.overlay{position:absolute;inset:0}figcaption{font-size:14px;min-height:40px}.cross .model{max-width:220px}button{background:#d9a56d;color:#10232f;border:0;border-radius:8px;padding:10px 18px}small{color:#c3d5da}.compact .model{max-width:52px}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><body><h1>Резонатор</h1><p>16 основных моделей · 6 финальных сочетаний. <button type="button" id="size">Масштаб поля / галерея</button></p><section><h2>База</h2><div class="grid"><figure class="tile"><div class="model"><img src="base.svg" alt="Резонатор"></div><figcaption>BASE · Резонатор</figcaption></figure></div></section><section><h2>A · Басовая волна</h2><div class="grid"><figure class="tile"><div class="model"><img src="a1.svg" alt="Расширитель диффузора"></div><figcaption>A1 · Расширитель диффузора</figcaption></figure><figure class="tile"><div class="model"><img src="a2.svg" alt="Двойной резонанс"></div><figcaption>A2 · Двойной резонанс</figcaption></figure><figure class="tile"><div class="model"><img src="a3.svg" alt="Низкая орбита"></div><figcaption>A3 · Низкая орбита</figcaption></figure><figure class="tile"><div class="model"><img src="a4.svg" alt="Обратная волна"></div><figcaption>A4 · Обратная волна</figcaption></figure><figure class="tile"><div class="model"><img src="a5.svg" alt="Сердце сабвуфера"></div><figcaption>A5 · Сердце сабвуфера</figcaption></figure></div></section><section><h2>B · Диссонанс</h2><div class="grid"><figure class="tile"><div class="model"><img src="b1.svg" alt="Сбитая нота"></div><figcaption>B1 · Сбитая нота</figcaption></figure><figure class="tile"><div class="model"><img src="b2.svg" alt="Фальшивая гармоника"></div><figcaption>B2 · Фальшивая гармоника</figcaption></figure><figure class="tile"><div class="model"><img src="b3.svg" alt="Зазубренный аккорд"></div><figcaption>B3 · Зазубренный аккорд</figcaption></figure><figure class="tile"><div class="model"><img src="b4.svg" alt="Расколотый унисон"></div><figcaption>B4 · Расколотый унисон</figcaption></figure><figure class="tile"><div class="model"><img src="b5.svg" alt="Корона разлада"></div><figcaption>B5 · Корона разлада</figcaption></figure></div></section><section><h2>C · Камертон</h2><div class="grid"><figure class="tile"><div class="model"><img src="c1.svg" alt="Чистый строй"></div><figcaption>C1 · Чистый строй</figcaption></figure><figure class="tile"><div class="model"><img src="c2.svg" alt="Общий метроном"></div><figcaption>C2 · Общий метроном</figcaption></figure><figure class="tile"><div class="model"><img src="c3.svg" alt="Два камертона"></div><figcaption>C3 · Два камертона</figcaption></figure><figure class="tile"><div class="model"><img src="c4.svg" alt="Синхронная решётка"></div><figcaption>C4 · Синхронная решётка</figcaption></figure><figure class="tile"><div class="model"><img src="c5.svg" alt="Золотой камертонный хор"></div><figcaption>C5 · Золотой камертонный хор</figcaption></figure></div></section><section><h2>Финальные 5–2–0</h2><div class="grid"><figure class="tile cross a"><div class="model"><img src="a5.svg" alt="Сердце сабвуфера"><img class="overlay" src="b2-overlay.svg" alt="Накладка B2"></div><figcaption>A5 + B2 · Сердце сабвуфера</figcaption></figure><figure class="tile cross a"><div class="model"><img src="a5.svg" alt="Сердце сабвуфера"><img class="overlay" src="c2-overlay.svg" alt="Накладка C2"></div><figcaption>A5 + C2 · Сердце сабвуфера</figcaption></figure><figure class="tile cross b"><div class="model"><img src="b5.svg" alt="Корона разлада"><img class="overlay" src="a2-overlay.svg" alt="Накладка A2"></div><figcaption>B5 + A2 · Корона разлада</figcaption></figure><figure class="tile cross b"><div class="model"><img src="b5.svg" alt="Корона разлада"><img class="overlay" src="c2-overlay.svg" alt="Накладка C2"></div><figcaption>B5 + C2 · Корона разлада</figcaption></figure><figure class="tile cross c"><div class="model"><img src="c5.svg" alt="Золотой камертонный хор"><img class="overlay" src="a2-overlay.svg" alt="Накладка A2"></div><figcaption>C5 + A2 · Золотой камертонный хор</figcaption></figure><figure class="tile cross c"><div class="model"><img src="c5.svg" alt="Золотой камертонный хор"><img class="overlay" src="b2-overlay.svg" alt="Накладка B2"></div><figcaption>C5 + B2 · Золотой камертонный хор</figcaption></figure></div></section><script>document.getElementById('size').addEventListener('click',()=>document.body.classList.toggle('compact'));</script></body></html>
