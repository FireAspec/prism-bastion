<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism Bastion — башни</title><style>
body{background:#102b31;color:#f5e9cf;font:16px system-ui;margin:24px}h1{font-size:24px}select,button,label{font:inherit;padding:8px}button,select{color:inherit;background:#24454b;border:1px solid #749b9c;border-radius:6px}header{position:sticky;top:0;background:#102b31;z-index:2;padding-bottom:12px}#cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}#cases button{text-align:left}.stage{position:relative;width:180px;height:160px;margin:12px auto;display:grid;place-items:center;background:radial-gradient(circle,#315b60,#18393f 70%);border:1px solid #69888a;border-radius:12px;overflow:hidden}.model{position:absolute;width:104px;height:104px;object-fit:contain;transform-origin:center}.stage .fallback{font-size:12px;max-width:120px;text-align:center;color:#f9bc71}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#detail{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:20px}#cases .active{outline:2px solid #f0be75}#status{white-space:pre-wrap;font:13px monospace}small{display:block;color:#c6d9d6;margin:5px 0}
</style></head><body><header><h1>Галерея анимаций башен</h1><div class="controls"><label>Башня <select id="tower"></select></label><label>Скорость <select id="speed"><option value="1">1×</option><option value="3">3×</option></select></label><label>FPS <select id="fps"><option>30</option><option selected>60</option><option>120</option></select></label><label><input id="reduced" type="checkbox"> Reduced motion</label><button id="replay">Повтор</button><button id="shot">Выстрел</button><button id="strike">Замах</button><button id="ability">Способность</button><button id="sell">Продажа</button></div><div id="detail"><div class="stage"><div class="fallback" id="missing"></div><img class="model" id="old" alt=""><img class="model" id="current" alt=""><img class="model" id="overlay" alt=""></div><div><strong id="title"></strong><small id="counts"></small><div id="status"></div></div></div></header><div id="cases"></div><script type="module" src="./gallery.ts"></script></body></html>
