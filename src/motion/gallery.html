<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prism Bastion — Motion Gallery</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101f23;color:#edf4e8}*{box-sizing:border-box}body{margin:0}main{max-width:1450px;margin:auto;padding:28px}h1{font-size:32px;margin:0 0 7px;color:#ffd292}p{color:#9fb9b7;margin:0 0 22px;line-height:1.5}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:#20383c;padding:16px;border:1px solid #40605e;border-radius:12px;position:sticky;top:0;z-index:2}button,select{font:inherit;color:#e9f2ed;background:#304d4d;border:1px solid #698681;border-radius:7px;padding:7px 11px;cursor:pointer}button:hover{background:#436966}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #ffd292;outline-offset:3px}#status{font-size:13px;color:#d8d5b8;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}article{background:#192f33;border:1px solid #36524f;border-radius:10px;padding:12px;min-width:0;overflow:hidden}article header{display:flex;flex-direction:column;gap:5px;min-height:47px}small{color:#9bb8b2;font-size:11px;overflow-wrap:anywhere}.stage{height:112px;position:relative;background:radial-gradient(ellipse,#2e4a48,#182c30 75%);border-radius:8px;overflow:hidden;display:grid;place-items:center}.piece{width:44px;height:44px;background:linear-gradient(135deg,#ffe3a0,#bb703c 50%,#784d3a);border:3px solid #f5d291;border-radius:12px;box-shadow:inset 0 0 0 5px #34555b;display:grid;place-items:center;font-size:20px;will-change:transform,opacity}.piece[data-style=shard],.piece[data-style=spawn],.piece[data-style=fade]{border-radius:0;clip-path:polygon(50% 0,100% 35%,80% 90%,20% 90%,0 35%);background:linear-gradient(135deg,#93ebea,#3d829b 55%,#25405b)}.piece[data-style=travel]{width:24px;height:14px;border-radius:30px;background:#ffd292;box-shadow:none}.ring{position:absolute;top:50%;left:50%;width:55px;height:55px;border:2px solid #9fe8de;border-radius:50%;pointer-events:none}.meter{height:3px;background:#29454a;margin:9px 0}.meter i{display:block;height:100%;background:#e5b77a;width:0}article button{width:100%;font-size:12px}.note{margin-top:20px;font-size:13px}@media(max-width:560px){main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{gap:8px;position:static}h1{font-size:25px}}
</style></head><body><main><h1>Prism Bastion · Режиссура</h1><p>Галерея общих движений и подтверждённых событий. Независимые часы игрового поля и интерфейса.</p><div class="toolbar"><button id="restart">Повторить всё</button><button id="pause">Пауза игры</button><label>Скорость <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select></label><label>FPS <select id="fps"><option>30</option><option selected>60</option><option>144</option></select></label><label><input id="reduced" type="checkbox"> Уменьшенное движение</label></div><div id="status" role="status"></div><div id="grid" class="grid"></div><p class="note">Схематические модели для проверки времени и переходов; реальные башни и враги подключаются в их отдельных модулях. FPS — целевая частота выборки, ограниченная частотой дисплея.</p></main><script type="module" src="./gallery.ts"></script></body></html>
